name: Flight Monitor

on:
  schedule:
    # 10:41 AM hora Colombia (UTC-5). Minuto no redondo a proposito: GitHub
    # retrasa horas los crons en punto (:00) por carga. La desactivacion por
    # 60 dias de inactividad la evita keepalive.yml.
    - cron: "41 15 * * *"
  workflow_dispatch:
    # Permite ejecutar manualmente desde GitHub Actions

permissions:
  contents: read

# Evita dos ejecuciones simultaneas (cron + manual) y resumenes duplicados.
concurrency:
  group: flight-monitor
  cancel-in-progress: false

jobs:
  check-flights:
    name: Check Flight Prices
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --locked --no-editable

      - name: Create flights.yaml from secret
        # Via env, not ${{ }} inside the script: quotes, $ or backticks in the
        # YAML would otherwise be interpreted by the shell.
        env:
          FLIGHTS_YAML: ${{ secrets.FLIGHTS_YAML }}
        run: printf '%s\n' "$FLIGHTS_YAML" > flights.yaml

      - name: Run flight monitor
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run --no-editable python -m flight_monitor --once
