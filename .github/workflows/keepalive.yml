name: Keepalive

# GitHub disables scheduled workflows in public repositories after 60 days
# without repository activity. Re-enabling a workflow through the API resets
# that inactivity counter, so this job keeps every scheduled workflow alive
# without dummy commits. It also re-enables itself.

on:
  schedule:
    # Weekly on Mondays; off the top of the hour to avoid queue delays.
    - cron: "23 13 * * 1"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    name: Reset scheduled workflow inactivity timer
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for workflow in monitor.yml codeql.yml keepalive.yml; do
            gh api --method PUT "repos/${REPO}/actions/workflows/${workflow}/enable"
            echo "Re-enabled ${workflow}"
          done
