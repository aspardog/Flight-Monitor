# Nearby airport alternatives by metro area
# Used when check_alternatives: true is set for a flight
# Only destination alternatives are checked (origin stays fixed)

alternatives:
  # Colombia
  BOG: [MDE, CTG]           # Bogota -> Medellin, Cartagena
  MDE: [BOG, CTG]
  CTG: [BOG, MDE]

  # US East Coast
  JFK: [EWR, LGA]           # NYC area
  EWR: [JFK, LGA]
  LGA: [JFK, EWR]
  IAD: [DCA, BWI]           # DC area
  DCA: [IAD, BWI]
  BWI: [IAD, DCA]

  # US Florida
  MIA: [FLL, PBI]           # Miami area
  FLL: [MIA, PBI]
  PBI: [MIA, FLL]

  # Peru
  LIM: []                   # Lima - no nearby alternatives

  # Spain
  MAD: []                   # Madrid - no practical alternatives
  BCN: [GRO, REU]           # Barcelona -> Girona, Reus

  # Add more airports as needed

# Paises y sus aeropuertos principales.
# Usados cuando un vuelo tiene country_alternatives: true, para comparar otras
# ciudades del mismo pais en las mismas fechas exactas.
# El orden importa: al aplicar country_alternatives_max se conservan los primeros.
countries:
  CO:
    name: Colombia
    airports: [BOG, MDE, CTG, SMR, BAQ, ADZ, CLO, PEI]

  MX:
    name: Mexico
    airports: [MEX, CUN, GDL, MTY, TIJ, PVR, SJD]

  ES:
    name: Espana
    airports: [MAD, BCN, AGP, VLC, SVQ, PMI]

  PE:
    name: Peru
    airports: [LIM, CUZ, AQP, PIU]

  AR:
    name: Argentina
    airports: [EZE, AEP, COR, MDZ, BRC]

  BR:
    name: Brasil
    airports: [GRU, GIG, BSB, SSA, REC, FOR]

  CL:
    name: Chile
    airports: [SCL, CJC, PMC, IQQ]

  US:
    name: Estados Unidos
    airports: [MIA, JFK, LAX, ORD, FLL, IAH, MCO]
